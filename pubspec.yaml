name: studybuddy
description: A friendly, offline-first study companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: 2.4.1
  sqflite_common_ffi_web: 0.4.5+4

  path: ^1.9.0
  intl: ^0.20.2
  fl_chart: ^0.69.2
  audioplayers: ^6.4.0
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/reminder.ogg
